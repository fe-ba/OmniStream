name: Build

# Compiles the Java code in src/, checks its format and runs the tests
# (ADR 0012). Runs only when something under src/ (or this workflow) changes.
on:
  push:
    paths:
      - 'src/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'src/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: 'src/**/pom.xml'

      # Format check, tests, architecture rules and coverage, with the Maven
      # version pinned by the wrapper
      - name: Verify
        run: ./mvnw --batch-mode --no-transfer-progress verify

      # Line and branch coverage per module, shown on the run's summary page (ADR 0020)
      - name: Coverage summary
        if: always()
        run: |
          {
            echo "### Test coverage"
            echo ""
            echo "| Module | Lines | Branches |"
            echo "|---|---|---|"
            for csv in */target/site/jacoco/jacoco.csv; do
              [ -f "$csv" ] || continue
              awk -F, -v module="${csv%%/*}" 'NR > 1 { bm += $6; bc += $7; lm += $8; lc += $9 }
                END {
                  lines = (lm + lc) ? sprintf("%.1f %%", 100 * lc / (lm + lc)) : "n/a"
                  branches = (bm + bc) ? sprintf("%.1f %%", 100 * bc / (bm + bc)) : "n/a"
                  printf "| %s | %s | %s |\n", module, lines, branches
                }' "$csv"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: src/*/target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: src/**/target/surefire-reports/
          retention-days: 7
