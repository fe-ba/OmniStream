name: Compilar poster

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: latex-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # LuaLaTeX no lee SVG. En local de esto se encarga .latexmkrc, pero aqui
      # latexmk corre dentro del contenedor de latex-action, que no trae
      # conversor, asi que los diagramas se convierten antes, en el runner.
      # .latexmkrc detecta que build/svg/ ya esta al dia y no hace nada.
      - name: Instalar conversor SVG
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin

      - name: Convertir diagramas SVG a PDF
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r -d '' svg; do
            pdf="build/svg/${svg%.svg}.pdf"
            mkdir -p "$(dirname "$pdf")"
            rsvg-convert --format=pdf --output="$pdf" "$svg"
          done < <(find imgs -type f -name '*.svg' -print0)

          svgs=$(find imgs -type f -name '*.svg' | wc -l)
          pdfs=$(find build/svg -type f -name '*.pdf' | wc -l)
          echo "Diagramas convertidos: $pdfs de $svgs"
          test "$pdfs" -eq "$svgs"

      - name: Compilar main.tex con LuaLaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          args: -pdflua -file-line-error -interaction=nonstopmode

      - name: Guardar PDF como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-pdf
          path: main.pdf
          if-no-files-found: warn

      - name: Guardar log si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: latex-log
          path: main.log
          if-no-files-found: ignore

      - name: Publicar main.pdf en el repo
        if: success() && github.event_name == 'push'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: actualizar main.pdf [skip ci]"
          file_pattern: main.pdf
